<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none" width="512" height="512">
  <defs>
    <linearGradient id="rocketBodyPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800020" />
      <stop offset="100%" stop-color="#470015" />
    </linearGradient>
    <linearGradient id="rocketNose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC143C" />
      <stop offset="100%" stop-color="#800020" />
    </linearGradient>
    <linearGradient id="exhaustSmoke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC143C" />
      <stop offset="100%" stop-color="#470015" />
    </linearGradient>
    <filter id="clayRocketShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="1.5" dy="2.5" />
      <feGaussianBlur std-deviation="3.2" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="black" flood-opacity="0.45" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>
  </defs>

  <g>
    <circle cx="70" cy="112" r="14" fill="url(#exhaustSmoke)" opacity="0.9" />
    <circle cx="51" cy="114" r="10" fill="url(#exhaustSmoke)" opacity="0.75" />
