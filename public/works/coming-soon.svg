<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- The bars crop this to a tall, narrow slice of its middle, 0.22 to 0.40
       as wide as they are tall at every screen size, and slide it sideways
       (parallax). So the text is a narrow block centred on x = 300 that
       stays inside the narrowest bar's slice through the whole slide. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#g)"/>
  <g transform="translate(300 450) rotate(-90)" fill="#f2f2f2" text-anchor="middle"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text y="-8" font-size="26" font-weight="600" letter-spacing="5">CURRENTLY BEING UPDATED</text>
    <text y="24" font-size="17" letter-spacing="7" fill-opacity="0.6">COME BACK SOON</text>
  </g>
</svg>
