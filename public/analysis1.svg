<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none" width="512" height="512">
  <defs>
    <linearGradient id="barGradBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800020" />
      <stop offset="100%" stop-color="#470015" />
    </linearGradient>
    <linearGradient id="barGradFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC143C" />
      <stop offset="100%" stop-color="#800020" />
    </linearGradient>
    <linearGradient id="analysisLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.55)" />
      <stop offset="100%" stop-color="rgba(220, 20, 60, 0.15)" />
    </linearGradient>
    <linearGradient id="analysisGoldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#DC143C" />
      <stop offset="100%" stop-color="#38000E" />
    </linearGradient>
    <filter id="clayInsetInner" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="1.5" dy="2.2" />
      <feGaussianBlur std-deviation="2" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="black" flood-opacity="0.4" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>
  </defs>

