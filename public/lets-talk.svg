<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <!-- Black-filled shape for the MetallicPaint effect (see MetallicPaint.tsx:
       the image is drawn to a canvas and its non-white pixels become the shape
       mask, so this must stay a solid black silhouette on a transparent field).

       Set in Franchise Free Bold. The glyphs are OUTLINES, not <text>: an SVG
       loaded through `new Image()` cannot pull in a webfont, so a <text> node
       would silently fall back to a system face. Outlines also mean no font
       file ships to the browser for this one wordmark.

       Franchise is condensed and tall enough to fill the box on its own, so
       unlike the old Impact version there is no scaleY stretch — the letter-
       forms are the designer's proportions. The ink is 940px wide and
       199px tall, centred in the 1000x300 frame; the margin left over is
       breathing room for the metallic edge treatment (glow / refraction),
       which clips if the shape touches the edge.

       Regenerate: outline Franchise-Free-Bold with fontTools — lay out
       LET'S-TALK at 0.03em tracking (the old letter-spacing 6 at font-size
       200), take the ink bbox, scale it to 940px wide and centre it here. -->
