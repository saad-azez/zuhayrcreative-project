<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none" width="512" height="512">
  <defs>
    <linearGradient id="analysisBarGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="analysisBarGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.55)" />
      <stop offset="100%" stop-color="rgba(219, 39, 119, 0.15)" />
    </linearGradient>
    <linearGradient id="glassRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>
    <filter id="clayInsetInner" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="1" dy="2" />
      <feGaussianBlur stdDeviation="2.5" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="black" flood-opacity="0.35" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>
  </defs>

  <g opacity="0.95">
    <rect x="30" y="65" width="15" height="35" rx="7.5" fill="url(#analysisBarGrad1)" filter="url(#clayInsetInner)" />
    <path d="M30 72.5 C34 70, 41 70, 45 72.5" stroke="white" stroke-width="2" stroke-opacity="0.35" />
    
    <rect x="52" y="45" width="15" height="55" rx="7.5" fill="url(#analysisBarGrad2)" filter="url(#clayInsetInner)" />
    <path d="M52 52.5 C56 50, 63 50, 67 52.5" stroke="white" stroke-width="2" stroke-opacity="0.45" />

    <rect x="74" y="55" width="15" height="45" rx="7.5" fill="url(#analysisBarGrad1)" filter="url(#clayInsetInner)" />
    <path d="M74 62.5 C78 60, 85 60, 89 62.5" stroke="white" stroke-width="2" stroke-opacity="0.35" />
  </g>

  <g style="transform-origin: 85px 85px">
    <rect x="88" y="88" width="14" height="32" rx="7" transform="rotate(-45 88 88)" fill="black" flood-opacity="0.2" />
    <rect x="86" y="86" width="14" height="32" rx="7" transform="rotate(-45 86 86)" fill="#9d174d" filter="url(#clayInsetInner)" />
    <circle cx="106" cy="106" r="6" fill="#db2777" />
    
    <circle cx="68" cy="58" r="29" fill="black" flood-opacity="0.15" />
    <circle cx="66" cy="56" r="28" stroke="url(#glassRing)" stroke-width="7" fill="url(#lensGrad)" filter="url(#clayInsetInner)" />
    <path d="M48 44 C56 38, 76 38, 84 44" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.75" />
    <circle cx="78" cy="48" r="2.5" fill="white" opacity="0.5" />
  </g>
</svg>