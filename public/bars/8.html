<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<!-- Same lime-green tell as page 7. -->
<meta name="theme-color" content="#00FF00" />
<title>8 — a tiny canvas</title>
<style>
  html, body { margin:0; background:#470015; color:#fff;
    font-family: ui-monospace, Menlo, monospace; }
  /* THE DIFFERENCE FROM PAGE 7: the canvas is a small square in the middle
     of the page instead of covering the screen. Pages 3-6 all had a canvas
     the size of the viewport, so they cannot tell us whether the problem is
     how MUCH of the screen the canvas covers, or simply that a WebGL context
     exists on the page at all.

       strip maroon (matches page) -> a small canvas is harmless; it is about
                                      COVERAGE, and the site can keep WebGL
                                      as long as it does not fill the screen
       strip still wrong           -> merely HAVING a WebGL canvas is enough,
                                      and no amount of moving or shrinking
                                      will help */
  #gl { position:absolute; top:50%; left:50%;
    width:200px; height:200px; margin:-100px 0 0 -100px;
    z-index:0; display:block; border-radius:8px; }
  section { min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px;
    position:relative; z-index:1; }
  h1 { font-size:20px; margin:0; letter-spacing:.1em; }
  p { margin:0; font-size:13px; opacity:.9; text-align:center; padding:0 24px;
    line-height:1.6; }
  a { color:#fff; font-size:12px; opacity:.7; }
  #readout { position:fixed; left:0; right:0; bottom:0; z-index:5;
    background:rgba(0,0,0,.55); font-size:11px; text-align:center; padding:4px 0; }
</style>
</head>
<body>
  <section>
    <h1>8 — TINY CANVAS</h1>
    <p>The page is plain maroon, exactly like page 2 —<br />
       except for one small WebGL square in the middle.</p>
    <p>Page 2 was perfect. If this one is wrong, then simply HAVING a WebGL
       canvas is what breaks the strip, no matter how small.</p>
    <a href="/bars/index.html">back to list</a>
    <canvas id="gl"></canvas>
  </section>
  <section><h1>SCROLL — SCREEN 2</h1></section>
  <section><h1>SCREEN 3 — END</h1></section>
  <div id="readout">measuring…</div>
<script>
(function () {
  var c = document.getElementById("gl");
  c.width = 200 * devicePixelRatio;
  c.height = 200 * devicePixelRatio;
  var gl = c.getContext("webgl");
  if (!gl) return;
  var t = 0;
  (function draw() {
    t += 1 / 60;
    var p = 0.5 + 0.5 * Math.sin(t * 0.7);
    gl.clearColor(0.62 + 0.06 * p, 0.36 + 0.05 * p, 0.42 + 0.05 * p, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    requestAnimationFrame(draw);
  })();
})();
(function () {
  function upd() {
    var c = document.getElementById("gl");
    var r = c.getBoundingClientRect();
    document.getElementById("readout").textContent =
      "theme-color " + document.querySelector('meta[name=theme-color]').content +
      "  |  canvas " + Math.round(r.width) + "x" + Math.round(r.height) +
      "  |  innerH " + window.innerHeight;
  }
  addEventListener("load", upd); addEventListener("resize", upd); setTimeout(upd, 600);
})();
</script>
</body>
</html>
