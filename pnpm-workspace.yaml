packages:
  - .

allowBuilds:
  sharp: false
  unrs-resolver: false

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Security floors for packages pulled in by other packages (17 Nov 2026,
# `pnpm audit`). Each pins the patched release within the same major, so
# nothing changes behaviour. Remove an entry once its parent ships the fix.
overrides:
  "@babel/core": "^7.29.6"
  browserslist: "^4.28.7"
  source-map-js: "^1.2.2"
  baseline-browser-mapping: "^2.11.0"
  "fflate@<0.6.11": "^0.6.11"
  "fflate@>=0.7.0 <0.8.3": "^0.8.3"
  # Build/lint tooling (Tailwind's PostCSS, ESLint plugins).
  postcss: "^8.5.23"
  "nanoid@<3.3.18": "^3.3.18"
  js-yaml: "^4.3.2"
  "brace-expansion@<1.1.21": "^1.1.21"
  "brace-expansion@>=5.0.0 <5.0.12": "^5.0.12"
  zod: "^4.6.6"
