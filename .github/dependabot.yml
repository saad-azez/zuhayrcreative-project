# Dependabot opens a pull request when a dependency has a security fix or a
# new release, so the site never again sits on a framework version with known
# holes (it was on Next.js 16.2.6, with five critical advisories, until
# 17 Nov 2026). Security-fix PRs are raised as soon as an advisory lands;
# routine version bumps are grouped into one PR a week to keep noise down.
version: 2
updates:
  - package-ecosystem: "npm" # also reads pnpm-lock.yaml
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
