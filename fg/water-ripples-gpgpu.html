<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass Experience</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #000;
        color: #fff;
      }

      #canvas-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      /* ── Loading Veil ── */
      #veil {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 100;
        background: #0a0202;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 1.2s cubic-bezier(0.65, 0, 0.35, 1);
        pointer-events: none;
      }
      #veil.hidden {
        opacity: 0;
      }
      #veil-label {
        font-size: 0.7rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(100, 40, 40, 0.6);
        margin-bottom: 1rem;
        font-weight: 300;
      }
      #progress-track {
        width: 220px;
        height: 2px;
        background: rgba(60, 20, 20, 0.15);
        border-radius: 2px;
        overflow: hidden;
      }
      #progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #4a1515, #8a3a22);
        border-radius: 2px;
        transition: width 0.3s ease;
      }

      /* ── Banner Overlay ── */
      .banner-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .banner-content {
        text-align: center;
        padding: 3.5rem 4.5rem;
        background: rgba(10, 2, 2, 0.35);
        backdrop-filter: blur(16px) saturate(1.2);
        -webkit-backdrop-filter: blur(16px) saturate(1.2);
        border: 1px solid rgba(60, 20, 20, 0.25);
        border-radius: 28px;
        max-width: 700px;
        width: 90%;
        pointer-events: auto;
        opacity: 0;
        transform: translateY(24px) scale(0.98);
        animation: revealIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
        box-shadow:
          0 0 80px rgba(180, 40, 40, 0.08),
          0 0 160px rgba(180, 40, 40, 0.04),
          inset 0 1px 0 rgba(255, 200, 150, 0.06);
        position: relative;
        overflow: hidden;
      }
      .banner-content::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(
          from 0deg at 50% 50%,
          transparent,
          rgba(60, 20, 20, 0.05),
          transparent,
          rgba(60, 20, 20, 0.05),
          transparent
        );
        animation: borderGlow 8s linear infinite;
        pointer-events: none;
      }
      @keyframes borderGlow {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .banner-badge {
        display: inline-block;
        padding: 0.4rem 1.4rem;
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(120, 50, 50, 0.95);
        border: 1px solid rgba(60, 20, 20, 0.35);
        border-radius: 100px;
        margin-bottom: 1.8rem;
        font-weight: 500;
        background: rgba(60, 20, 20, 0.1);
        position: relative;
        z-index: 1;
      }

      .banner-title {
        font-size: clamp(2.8rem, 9vw, 5.5rem);
        font-weight: 800;
        font-family: "Playfair Display", serif;
        background: linear-gradient(
          135deg,
          #c8a088 0%,
          #4a1010 45%,
          #1a0404 75%,
          #060101 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 0.6rem;
        line-height: 1.05;
        letter-spacing: -0.03em;
        position: relative;
        z-index: 1;
      }

      .banner-subtitle {
        font-size: clamp(0.9rem, 2vw, 1.1rem);
        color: rgba(255, 255, 255, 0.5);
        margin-bottom: 1.8rem;
        font-weight: 300;
        letter-spacing: 0.08em;
        position: relative;
        z-index: 1;
      }

      .banner-divider {
        width: 48px;
        height: 1.5px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(60, 20, 20, 0.6),
          transparent
        );
        margin: 0 auto 1.8rem;
        position: relative;
        z-index: 1;
      }

      .banner-features {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.6rem 1.5rem;
        margin-bottom: 2.2rem;
        position: relative;
        z-index: 1;
      }

      .feature-item {
        font-size: 0.78rem;
        color: rgba(255, 255, 255, 0.45);
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-weight: 300;
        letter-spacing: 0.04em;
        padding: 0.35rem 1rem;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 100px;
        background: rgba(255, 255, 255, 0.03);
      }
      .feature-item::before {
        content: "◆";
        font-size: 0.45rem;
        color: rgba(60, 20, 20, 0.7);
      }

      .scroll-indicator {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        animation: bob 2.4s ease-in-out infinite;
        opacity: 0.6;
        position: relative;
        z-index: 1;
      }

      .scroll-text {
        font-size: 0.6rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.25);
      }

      .scroll-arrow {
        font-size: 0.85rem;
        color: rgba(60, 20, 20, 0.55);
        line-height: 1;
      }

      /* ── Corner decorations ── */
      .corner-decor {
        position: fixed;
        z-index: 11;
        pointer-events: none;
        opacity: 0;
        animation: fadeIn 1.4s ease 1s forwards;
      }
      .corner-decor.tl {
        top: 28px;
        left: 28px;
      }
      .corner-decor.tr {
        top: 28px;
        right: 28px;
        transform: scaleX(-1);
      }
      .corner-decor.bl {
        bottom: 28px;
        left: 28px;
        transform: scaleY(-1);
      }
      .corner-decor.br {
        bottom: 28px;
        right: 28px;
        transform: scale(-1, -1);
      }
      .corner-decor svg {
        width: 28px;
        height: 28px;
      }

      @keyframes revealIn {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes fadeIn {
        to {
          opacity: 0.4;
        }
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(8px);
        }
      }

      @media (max-width: 768px) {
        body {
          touch-action: none;
        }
        .banner-content {
          padding: 2rem 1.5rem;
          border-radius: 18px;
          background: rgba(10, 2, 2, 0.55);
        }
        .banner-features {
          gap: 0.5rem 0.8rem;
        }
        .feature-item {
          font-size: 0.7rem;
          padding: 0.25rem 0.75rem;
        }
        .banner-badge {
          font-size: 0.6rem;
          padding: 0.25rem 0.9rem;
        }
        .corner-decor {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>

    <!-- Loading Veil -->
    <div id="veil">
      <div id="veil-label">Awakening the water</div>
      <div id="progress-track"><div id="progress-fill"></div></div>
    </div>

    <!-- Corner Decorations -->
    <div class="corner-decor tl">
      <svg
        viewBox="0 0 28 28"
        fill="none"
        stroke="rgba(50,15,15,0.6)"
        stroke-width="1.5"
      >
        <path d="M2 26V6a4 4 0 0 1 4-4h20" />
        <path d="M6 22V9a3 3 0 0 1 3-3h17" />
      </svg>
    </div>
    <div class="corner-decor tr">
      <svg
        viewBox="0 0 28 28"
        fill="none"
        stroke="rgba(50,15,15,0.6)"
        stroke-width="1.5"
      >
        <path d="M2 26V6a4 4 0 0 1 4-4h20" />
        <path d="M6 22V9a3 3 0 0 1 3-3h17" />
      </svg>
    </div>
    <div class="corner-decor bl">
      <svg
        viewBox="0 0 28 28"
        fill="none"
        stroke="rgba(50,15,15,0.6)"
        stroke-width="1.5"
      >
        <path d="M2 26V6a4 4 0 0 1 4-4h20" />
        <path d="M6 22V9a3 3 0 0 1 3-3h17" />
      </svg>
    </div>
    <div class="corner-decor br">
      <svg
        viewBox="0 0 28 28"
        fill="none"
        stroke="rgba(50,15,15,0.6)"
        stroke-width="1.5"
      >
        <path d="M2 26V6a4 4 0 0 1 4-4h20" />
        <path d="M6 22V9a3 3 0 0 1 3-3h17" />
      </svg>
    </div>

    <!-- Banner Overlay -->
    <div class="banner-overlay">
      <div class="banner-content">
        <div class="banner-badge">✦ Maroon Collection</div>
        <h1 class="banner-title">Crimson Waves</h1>
        <p class="banner-subtitle">
          Touch or move your cursor to create ripples
        </p>
        <div class="banner-divider"></div>
        <div class="banner-features">
          <div class="feature-item">
            <span>Real-time Simulation</span>
          </div>
          <div class="feature-item">
            <span>GPU Accelerated</span>
          </div>
          <div class="feature-item">
            <span>3D Visualization</span>
          </div>
        </div>
        <div class="scroll-indicator">
          <span class="scroll-text">explore</span>
          <div class="scroll-arrow">↓</div>
        </div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { GPUComputationRenderer } from "three/addons/misc/GPUComputationRenderer.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

      THREE.ColorManagement.enabled = true;

      // ── Constants ──
      const FBO_W = 512,
        FBO_H = 256;
      const GEOM_W = innerWidth,
        GEOM_H = innerHeight;
      const HALF_W = GEOM_W / 2,
        HALF_H = GEOM_H / 2;

      // ── Heightmap physics (GPU compute) ──
      const heightmapFrag = `
        uniform vec2 mousePos;
        uniform float mouseSize;
        uniform float viscosityConstant;
        uniform float waveheightMultiplier;
        void main() {
          vec2 cs = 1.0 / resolution.xy;
          vec2 uv = gl_FragCoord.xy * cs;
          vec4 hm = texture2D(heightmap, uv);
          vec4 n = texture2D(heightmap, uv + vec2(0.0, cs.y));
          vec4 s = texture2D(heightmap, uv + vec2(0.0, -cs.y));
          vec4 e = texture2D(heightmap, uv + vec2(cs.x, 0.0));
          vec4 w = texture2D(heightmap, uv + vec2(-cs.x, 0.0));
          float nh = ((n.x + s.x + e.x + w.x) * 0.5 - hm.y) * viscosityConstant;
          float mp = clamp(length((uv - 0.5) * vec2(${GEOM_W.toFixed(1)}, ${GEOM_H.toFixed(1)}) - mousePos) * 3.14159 / mouseSize, 0.0, 3.14159);
          nh += (cos(mp) + 1.0) * waveheightMultiplier;
          hm.y = hm.x; hm.x = nh;
          gl_FragColor = hm;
        }`;

      // ── Water vertex shader ──
      const waterVert = `
        uniform sampler2D heightmap;
        uniform float uTime;
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying vec2 vUv;
        varying float vHeight;
        void main() {
          vUv = uv;
          vec2 cs = vec2(1.0 / ${FBO_W.toFixed(1)}, 1.0 / ${FBO_H.toFixed(1)});
          float h   = texture2D(heightmap, uv).x;
          float hL  = texture2D(heightmap, uv + vec2(-cs.x, 0.0)).x;
          float hR  = texture2D(heightmap, uv + vec2(cs.x, 0.0)).x;
          float hD  = texture2D(heightmap, uv + vec2(0.0, -cs.y)).x;
          float hU  = texture2D(heightmap, uv + vec2(0.0, cs.y)).x;
          vec3 norm = normalize(vec3(
            (hL - hR) * ${FBO_W.toFixed(1)} / ${GEOM_W.toFixed(1)},
            (hD - hU) * ${FBO_H.toFixed(1)} / ${GEOM_H.toFixed(1)}, 1.0
          ));
          vNormal = norm;
          vHeight = h;
          vec4 wPos = modelMatrix * vec4(position.x, position.y, h, 1.0);
          vViewPosition = cameraPosition - wPos.xyz;
          gl_Position = projectionMatrix * viewMatrix * wPos;
        }`;

      // ── Water fragment shader (premium — fresnel, animated shimmer) ──
      const waterFrag = `
        uniform vec3  diffuse;
        uniform vec3  specular;
        uniform float shininess;
        uniform sampler2D map;
        uniform float opacity;
        uniform float uTime;
        varying vec3  vNormal;
        varying vec3  vViewPosition;
        varying vec2  vUv;
        varying float vHeight;

        void main() {
          vec3 n = normalize(vNormal);
          vec3 v = normalize(vViewPosition);

          // Fresnel
          float fresnel = pow(1.0 - max(dot(n, v), 0.0), 3.0);

          // Lighting
          vec3 ld = normalize(vec3(0.5, 0.8, 0.3));
          float diff = max(dot(n, ld), 0.0);
          vec3 hh = normalize(ld + v);
          float spec = pow(max(dot(n, hh), 0.0), shininess);

          // Animated shimmer across surface
          float shimmer = sin(vUv.x * 40.0 + vUv.y * 30.0 + uTime * 0.6) * 0.5 + 0.5;
          shimmer *= sin(vUv.y * 50.0 - vUv.x * 20.0 + uTime * 0.4) * 0.5 + 0.5;
          shimmer *= 0.12;

          // Refraction offset
          vec2 duv = vUv + n.xy * (0.03 + fresnel * 0.04);
          vec4 tex = texture2D(map, duv);
          vec3 col = (diffuse * 0.06 + diffuse * diff + specular * spec) * tex.rgb;

          // Fresnel rim (reflection-like edge)
          vec3 fresnelCol = mix(vec3(0.25, 0.08, 0.05), vec3(0.6, 0.3, 0.15), fresnel);
          col = mix(col, fresnelCol, fresnel * 0.35);

          // Shimmer sparkle
          col += specular * shimmer * 0.5;

          // Height-based glow (ripple crests catch light)
          float crest = smoothstep(0.3, 1.0, abs(vHeight) * 3.0);
          col += vec3(0.25, 0.08, 0.04) * crest * 0.12;

          gl_FragColor = vec4(col, opacity);
        }`;

      // ── Sparkle particle system ──
      function createSparkles() {
        const count = 120;
        const geom = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        const sizes = new Float32Array(count);
        const offsets = new Float32Array(count);
        for (let i = 0; i < count; i++) {
          pos[i * 3] = (Math.random() - 0.5) * GEOM_W * 1.2;
          pos[i * 3 + 1] = (Math.random() - 0.5) * GEOM_H * 1.2;
          pos[i * 3 + 2] = 0;
          sizes[i] = 1.0 + Math.random() * 2.5;
          offsets[i] = Math.random() * 100;
        }
        geom.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        geom.setAttribute("size", new THREE.BufferAttribute(sizes, 1));
        geom.setAttribute("offset", new THREE.BufferAttribute(offsets, 1));

        const mat = new THREE.ShaderMaterial({
          uniforms: { uTime: { value: 0 } },
          vertexShader: `
            attribute float size;
            attribute float offset;
            uniform float uTime;
            varying float vAlpha;
            void main() {
              vec3 p = position;
              float t = uTime * 0.3 + offset;
              p.x += sin(t * 0.7 + position.y * 0.01) * 8.0;
              p.y += cos(t * 0.5 + position.x * 0.01) * 8.0;
              vAlpha = 0.15 + 0.35 * (0.5 + 0.5 * sin(t * 0.8 + offset));
              vec4 mv = modelViewMatrix * vec4(p, 1.0);
              gl_PointSize = size * (80.0 / -mv.z);
              gl_Position = projectionMatrix * mv;
            }
          `,
          fragmentShader: `
            varying float vAlpha;
            void main() {
              float d = length(gl_PointCoord - 0.5);
              if (d > 0.5) discard;
              float a = smoothstep(0.5, 0.0, d) * vAlpha;
              gl_FragColor = vec4(1.0, 0.6, 0.35, a * 0.7);
            }
          `,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        return new THREE.Points(geom, mat);
      }

      // ── Update loading progress ──
      function updateProgress(frac) {
        const fill = document.getElementById("progress-fill");
        if (fill) fill.style.width = `${frac * 100}%`;
      }

      // ── App ──
      const container = document.getElementById("canvas-container");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x040101);

      const camera = new THREE.OrthographicCamera(
        -HALF_W,
        HALF_W,
        HALF_H,
        -HALF_H,
        -1000,
        1000,
      );

      // ── Lights ──
      const l1 = new THREE.DirectionalLight(0xffaa77, 2.5);
      l1.position.set(300, 400, 175);
      scene.add(l1);
      const l2 = new THREE.DirectionalLight(0xaa4422, 0.4);
      l2.position.set(-150, 350, -200);
      scene.add(l2);
      const l3 = new THREE.DirectionalLight(0x662211, 0.15);
      l3.position.set(0, -200, 300);
      scene.add(l3);
      scene.add(new THREE.AmbientLight(0x220404, 0.35));

      // ── Renderer ──
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(GEOM_W, GEOM_H);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.9;
      container.appendChild(renderer.domElement);
      container.style.touchAction = "none";

      // ── Post-processing (Bloom) ──
      const composer = new EffectComposer(renderer);
      const renderPass = new RenderPass(scene, camera);
      composer.addPass(renderPass);
      const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(GEOM_W, GEOM_H),
        0.4,
        0.2,
        0.0,
      );
      composer.addPass(bloomPass);

      // ── Water texture ──
      function makeTexture() {
        const c = document.createElement("canvas");
        c.width = c.height = 1024;
        const ctx = c.getContext("2d");

        // Base gradient
        const g = ctx.createLinearGradient(0, 0, 0, 1024);
        g.addColorStop(0, "#4A1010"); // dark maroon
        g.addColorStop(0.3, "#2E0808"); // very dark
        g.addColorStop(0.55, "#1A0404"); // deep dark
        g.addColorStop(0.8, "#0E0202"); // near black
        g.addColorStop(1, "#060101"); // black
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 1024, 1024);

        // Subtle organic noise overlay
        for (let i = 0; i < 3000; i++) {
          const x = Math.random() * 1024;
          const y = Math.random() * 1024;
          const r = 0.5 + Math.random() * 2;
          const a = 0.02 + Math.random() * 0.04;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${a})`;
          ctx.fill();
        }

        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        t.needsUpdate = true;
        return t;
      }

      // ── Water material ──
      const uniforms = {
        diffuse: { value: new THREE.Color(0xaa6650) },
        specular: { value: new THREE.Color(0x664840) },
        shininess: { value: 80 },
        map: { value: makeTexture() },
        opacity: { value: 0.9 },
        heightmap: { value: null },
        uTime: { value: 0 },
      };

      const material = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: waterVert,
        fragmentShader: waterFrag,
        transparent: true,
      });

      const waterMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(GEOM_W, GEOM_H, FBO_W, FBO_H),
        material,
      );
      scene.add(waterMesh);

      // ── Sparkles ──
      const sparkles = createSparkles();
      scene.add(sparkles);

      // ── GPU Compute ──
      const gpuCompute = new GPUComputationRenderer(FBO_W, FBO_H, renderer);
      if (!renderer.capabilities.isWebGL2)
        gpuCompute.setDataType(THREE.HalfFloatType);

      const ht0 = gpuCompute.createTexture();
      fillTexture(ht0);

      const hmVar = gpuCompute.addVariable("heightmap", heightmapFrag, ht0);
      gpuCompute.setVariableDependencies(hmVar, [hmVar]);

      const mousePos = new THREE.Vector2(10000, 10000);
      const hmU = hmVar.material.uniforms;
      hmU.mousePos = { value: mousePos };
      hmU.mouseSize = { value: 20 };
      hmU.viscosityConstant = { value: 0.97 };
      hmU.waveheightMultiplier = { value: 0.2 };

      const err = gpuCompute.init();
      if (err) console.error(err);

      function fillTexture(t) {
        const p = t.image.data;
        p.fill(0);
        for (let idx = 3; idx < p.length; idx += 4) p[idx] = 1;
      }

      // ── Pointer → raycaster ──
      let mouseMoved = false;
      const mouseCoords = new THREE.Vector2();
      const raycaster = new THREE.Raycaster();

      function setMouseCoords(x, y) {
        mouseCoords.x = (x / renderer.domElement.clientWidth) * 2 - 1;
        mouseCoords.y = -(y / renderer.domElement.clientHeight) * 2 + 1;
        mouseMoved = true;
      }

      container.addEventListener("pointermove", (e) => {
        if (e.isPrimary === false) return;
        setMouseCoords(e.clientX, e.clientY);
      });
      container.addEventListener("pointerdown", (e) => {
        if (e.isPrimary === false) return;
        setMouseCoords(e.clientX, e.clientY);
      });

      // ── Auto ambient ripples ──
      let autoRippleTimer = 0;

      // ── Resize ──
      addEventListener("resize", () => {
        const hw = innerWidth / 2,
          hh = innerHeight / 2;
        camera.left = -hw;
        camera.right = hw;
        camera.top = hh;
        camera.bottom = -hh;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        composer.setSize(innerWidth, innerHeight);
      });

      // ── Loading simulation ──
      updateProgress(0);
      let loadProgress = 0;
      const loadInterval = setInterval(() => {
        loadProgress += 0.08 + Math.random() * 0.12;
        if (loadProgress > 1) loadProgress = 1;
        updateProgress(loadProgress);
        if (loadProgress >= 1) {
          clearInterval(loadInterval);
          setTimeout(() => {
            document.getElementById("veil").classList.add("hidden");
          }, 300);
        }
      }, 180);

      // ── Loop ──
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();
        const elapsed = clock.getElapsedTime();

        // Update uniforms
        uniforms.uTime.value = elapsed;
        sparkles.material.uniforms.uTime.value = elapsed;

        // Mouse / raycaster
        const hmUniforms = hmU;
        if (mouseMoved) {
          raycaster.setFromCamera(mouseCoords, camera);
          const intersects = raycaster.intersectObject(waterMesh);
          if (intersects.length > 0) {
            const point = intersects[0].point;
            hmUniforms.mousePos.value.set(point.x, point.y);
          } else {
            hmUniforms.mousePos.value.set(10000, 10000);
          }
          mouseMoved = false;
        } else {
          // Auto ambient ripples when idle
          autoRippleTimer += dt;
          if (autoRippleTimer > 2.5) {
            const rx = (Math.random() - 0.5) * GEOM_W * 0.8;
            const ry = (Math.random() - 0.5) * GEOM_H * 0.8;
            hmUniforms.mousePos.value.set(rx, ry);
            hmUniforms.mouseSize.value = 12 + Math.random() * 10;
            hmUniforms.waveheightMultiplier.value = 0.08 + Math.random() * 0.06;
            autoRippleTimer = 0;
          } else {
            hmUniforms.mousePos.value.set(10000, 10000);
            hmUniforms.mouseSize.value = 20;
            hmUniforms.waveheightMultiplier.value = 0.2;
          }
        }

        gpuCompute.compute();
        uniforms.heightmap.value =
          gpuCompute.getCurrentRenderTarget(hmVar).texture;

        composer.render();
      }
      animate();
    </script>
  </body>
</html>
